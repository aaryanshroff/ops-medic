name: Terraform Deployment with AI QA
on: [push]

jobs:
  terraform-apply:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-2
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        
      - name: Terraform Init
        run: |
          cd terraform/s3
          terraform init
          
      - name: Terraform Destroy
        run: |
          cd terraform/s3
          terraform destroy -auto-approve
          
      - name: Terraform Plan
        env:
          TF_LOG: DEBUG
          TF_VAR_github_repository: ${{ github.repository }} # Pass the repository name as a TF variable
        run: |
          cd terraform/s3
          terraform plan -out=tfplan
        
      - name: Terraform Apply
        run: |
          cd terraform/s3
          terraform apply -auto-approve tfplan

  ai-qa-check:
    runs-on: ubuntu-latest
    needs: terraform-apply
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: aaryanshroff/ai-terraform-qa-action@v0.0.8
        with:
          tf_apply_job: "terraform-apply"
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}